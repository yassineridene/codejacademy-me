<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Codej Academy</title>
<link rel="icon" href="/icon.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(60rem 36rem at 12% -10%,rgba(63,165,53,.35),transparent 60%),
               radial-gradient(50rem 30rem at 95% 110%,rgba(76,201,240,.22),transparent 60%),#050d1a}
  img{height:44px;width:auto;margin-bottom:28px}
  .n{font-size:clamp(6rem,24vw,13rem);font-weight:800;line-height:.9;letter-spacing:-.02em;color:transparent;
    -webkit-text-stroke:2px rgba(255,255,255,.28)}
  h1{margin:18px 0 6px;font-size:1.7rem}
  p{margin:0;color:rgba(255,255,255,.62)}
  .ar{margin-top:18px;direction:rtl}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
  a{display:inline-flex;align-items:center;height:48px;padding:0 26px;border-radius:999px;font-weight:700;
    text-decoration:none;color:#fff;background:#3fa535;box-shadow:0 10px 34px -8px rgba(63,165,53,.75)}
  a.o{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.18)}
  a:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<main>
  <img src="/logo-mark-light.png" alt="Codej Academy">
  <div class="n" dir="ltr">404</div>
  <h1>Page introuvable</h1>
  <p>Cette page n'existe pas ou plus.</p>
  <p class="ar">هذه الصفحة غير موجودة أو لم تعد متاحة.</p>
  <div class="row">
    <a href="/">Retour à l'accueil</a>
    <a class="o" href="/ar/">العودة إلى الرئيسية</a>
  </div>
</main>
</body>
</html>
